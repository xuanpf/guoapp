name: Build iOS unsigned

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-ios.yml

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Build unsigned iOS app
        run: python3 scripts/build_ios.py --all-sources
      - uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-ios-unsigned
          path: |
            dist/ios/*-ios-unsigned.ipa
            dist/ios/*-ios-unsigned-app.zip
            dist/ios/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
